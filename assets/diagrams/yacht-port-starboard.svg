<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="640" height="612" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>ポート・タックとスターボード・タック：風を左から受けるか右から受けるかの違いと、避ける側の艇</title>
<rect width="640" height="612" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6fd6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9aa3b2"/></marker></defs>
<rect x="10" y="8" width="620" height="238" rx="10" fill="#eaf2fb"/>
<rect x="10" y="262" width="620" height="340" rx="10" fill="#eaf2fb"/>
<line x1="20" y1="66" x2="78" y2="66" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="26" y="52" font-size="18" fill="#2f6fd6" text-anchor="start" font-weight="bold">風</text>
<g transform="translate(160,120) rotate(0) scale(1.7)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="18" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<text x="160" y="36" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">ポート・タック</text>
<text x="160" y="224" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="normal">風を左側から受ける</text>
<text x="112" y="120" font-size="15" fill="#5b6475" text-anchor="end" font-weight="normal">左舷</text>
<text x="208" y="120" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">右舷</text>
<line x1="620" y1="66" x2="562" y2="66" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="614" y="52" font-size="18" fill="#2f6fd6" text-anchor="end" font-weight="bold">風</text>
<g transform="translate(480,120) rotate(0) scale(1.7)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="-18" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<text x="480" y="36" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">スターボード・タック</text>
<text x="480" y="224" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="normal">風を右側から受ける</text>
<text x="432" y="120" font-size="15" fill="#5b6475" text-anchor="end" font-weight="normal">左舷</text>
<text x="528" y="120" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">右舷</text>
<text x="320" y="128" font-size="15" fill="#5b6475" text-anchor="middle" font-weight="normal">帆は風と</text>
<text x="320" y="146" font-size="15" fill="#5b6475" text-anchor="middle" font-weight="normal">反対側に出る</text>
<text x="24" y="292" font-size="18" fill="#1f2a44" text-anchor="start" font-weight="bold">2艇が交差するとき</text>
<line x1="590" y1="306" x2="590" y2="376" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="560" y="336" font-size="20" fill="#2f6fd6" text-anchor="end" font-weight="bold">風</text>
<path d="M388,488 L320,420 L296,396" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<path d="M206,534 L320,420" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<text x="320" y="428" font-size="26" fill="#d64545" text-anchor="middle" font-weight="bold">×</text>
<text x="320" y="398" font-size="15" fill="#d64545" text-anchor="middle" font-weight="normal">このまま進むと接触</text>
<g transform="translate(398,498) rotate(-45) scale(1.6)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="-9" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(196,544) rotate(45) scale(1.6)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="9" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<text x="396" y="574" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="bold">スターボード・タックの艇</text>
<text x="396" y="594" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="normal">進路を保って進める</text>
<text x="24" y="470" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold">ポート・タックの艇</text>
<text x="24" y="492" font-size="15" fill="#d64545" text-anchor="start" font-weight="normal">相手を避ける</text>
</svg>
