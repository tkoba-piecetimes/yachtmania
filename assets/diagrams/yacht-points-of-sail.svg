<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>風に対する帆走の名称：クローズホールド、ビームリーチ、ブロードリーチ、ランニングと、風上に進めない範囲</title>
<rect width="640" height="430" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6fd6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9aa3b2"/></marker></defs>
<polygon points="320,232 230.0,124.8 410.0,124.8" fill="#d64545" opacity="0.18"/>
<line x1="320" y1="232" x2="230.00973464388449" y2="124.75377796334308" stroke="#d64545" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="320" y1="232" x2="409.9902653561155" y2="124.75377796334308" stroke="#d64545" stroke-width="2" stroke-dasharray="5 4"/>
<text x="320" y="170" font-size="16" fill="#d64545" text-anchor="middle" font-weight="bold">進めない範囲</text>
<line x1="320" y1="14" x2="320" y2="84" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="334" y="44" font-size="20" fill="#2f6fd6" text-anchor="start" font-weight="bold">風</text>
<line x1="320" y1="232" x2="418.99494936611666" y2="133.00505063388334" stroke="#1f2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="320" y1="232" x2="460.0" y2="232.0" stroke="#1f2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="320" y1="232" x2="418.99494936611666" y2="330.99494936611666" stroke="#1f2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="320" y1="232" x2="320.0" y2="372.0" stroke="#1f2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="320" y1="232" x2="221.00505063388334" y2="133.00505063388334" stroke="#9aa3b2" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<line x1="320" y1="232" x2="180.0" y2="232.0" stroke="#9aa3b2" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<line x1="320" y1="232" x2="221.00505063388334" y2="330.99494936611666" stroke="#9aa3b2" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<circle cx="320" cy="232" r="9" fill="#fff" stroke="#1f2a44" stroke-width="3"/>
<text x="428" y="128" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="bold">クローズホールド</text>
<text x="428" y="146" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="normal">風上へ進める限界の向き</text>
<text x="470" y="226" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="bold">ビームリーチ</text>
<text x="470" y="246" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="normal">風を真横から受ける</text>
<text x="428" y="338" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="bold">ブロードリーチ</text>
<text x="428" y="356" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="normal">風を斜め後ろから受ける</text>
<text x="305" y="400" font-size="16" fill="#1f2a44" text-anchor="end" font-weight="bold">ランニング</text>
<text x="305" y="418" font-size="15" fill="#1f2a44" text-anchor="end" font-weight="normal">風を真後ろから受ける</text>
<text x="20" y="226" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">左側へ進む走り方も</text>
<text x="20" y="244" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">同じ名前で呼びます</text>
</svg>
