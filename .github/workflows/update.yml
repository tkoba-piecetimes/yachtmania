name: Update and deploy site

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pykakasi pdfplumber
      - name: Fetch yacht data (加盟大学・大会カレンダー・成績PDFリンク)
        run: python pipeline/fetch_all.py
      - name: Parse result PDFs (新規検知分のみ表構造を解析)
        run: python pipeline/fetch_pdf_results.py
      - name: Generate Type A articles (新着成績 / 大学別成績まとめ / 水域別シーズン総括)
        run: python pipeline/generate_articles.py
      - name: Generate site
        run: |
          python -m unittest discover -s pipeline -p 'test_*.py'
          python pipeline/generate_site.py
      - name: Commit updated data & site
        if: github.event_name != 'push'
        run: |
          git config user.name "yachtmania-bot"
          git config user.email "bot@piecetimes.jp"
          git add data content site
          git diff --cached --quiet || git commit -m "chore: 大学ヨットのデータを自動更新"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # アップロード直後は公開用ファイルが一覧にまだ出ないことがあり、
      # その瞬間に当たるとデプロイが「No artifacts named github-pages」で落ちる。
      # 少し待ってからデプロイし、落ちたら間隔を空けて2回までやり直す。
      - name: Wait for the uploaded artifact to be listed
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 2
        if: steps.deployment_retry1.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
