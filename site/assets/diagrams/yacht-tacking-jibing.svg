<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>タッキングとジャイビングの比較：風上側で向きを変えるタッキングと、風下側で向きを変えるジャイビング</title>
<rect width="640" height="580" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6fd6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9aa3b2"/></marker></defs>
<rect x="10" y="8" width="620" height="268" rx="10" fill="#eaf2fb"/>
<rect x="10" y="296" width="620" height="274" rx="10" fill="#eaf2fb"/>
<text x="24" y="36" font-size="18" fill="#1f2a44" text-anchor="start" font-weight="bold">タッキング（風上側で向きを変える）</text>
<text x="24" y="324" font-size="18" fill="#1f2a44" text-anchor="start" font-weight="bold">ジャイビング（風下側で向きを変える）</text>
<line x1="590" y1="50" x2="590" y2="120" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="560" y="80" font-size="20" fill="#2f6fd6" text-anchor="end" font-weight="bold">風</text>
<line x1="590" y1="338" x2="590" y2="408" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="560" y="368" font-size="20" fill="#2f6fd6" text-anchor="end" font-weight="bold">風</text>
<path d="M96,246 L212,150" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>
<path d="M232,134 Q252,112 232,96 L170,72" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>
<g transform="translate(88,252) rotate(45) scale(1.0)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="8" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(228,160) rotate(0) scale(1.0)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 4"/></g>
<g transform="translate(160,80) rotate(-45) scale(1.0)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="-8" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<circle cx="60" cy="232" r="11" fill="#1f2a44"/><text x="60" y="237" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="262" cy="170" r="11" fill="#1f2a44"/><text x="262" y="175" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="196" cy="66" r="11" fill="#1f2a44"/><text x="196" y="71" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="330" cy="98" r="11" fill="#1f2a44"/><text x="330" y="103" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="352" y="104" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="normal">風上へ斜めに進む</text>
<circle cx="330" cy="138" r="11" fill="#1f2a44"/><text x="330" y="143" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="352" y="144" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="normal">艇の先を風に向ける</text>
<circle cx="330" cy="178" r="11" fill="#1f2a44"/><text x="330" y="183" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="352" y="184" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="normal">反対側へ斜めに進む</text>
<text x="330" y="238" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">②で帆はいったん風を受けなくなる</text>
<text x="330" y="258" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">（艇の動きを保つため速度が大切）</text>
<path d="M96,368 L206,436" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>
<path d="M226,484 L190,520" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>
<g transform="translate(86,358) rotate(135) scale(1.0)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="18" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(236,454) rotate(180) scale(1.0)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(168,532) rotate(225) scale(1.0)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="-18" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<path d="M258,478 Q276,464 262,448" stroke="#d64545" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<circle cx="36" cy="380" r="11" fill="#1f2a44"/><text x="36" y="385" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="276" cy="438" r="11" fill="#1f2a44"/><text x="276" y="443" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="130" cy="524" r="11" fill="#1f2a44"/><text x="130" y="529" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="330" cy="358" r="11" fill="#1f2a44"/><text x="330" y="363" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="352" y="364" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="normal">風を斜め後ろから受ける</text>
<circle cx="330" cy="398" r="11" fill="#1f2a44"/><text x="330" y="403" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="352" y="404" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="normal">艇の後ろを風が通る</text>
<circle cx="330" cy="438" r="11" fill="#1f2a44"/><text x="330" y="443" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="352" y="444" font-size="16" fill="#1f2a44" text-anchor="start" font-weight="normal">帆が反対側へ振れる</text>
<text x="330" y="494" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">帆と横棒が勢いよく動くので</text>
<text x="330" y="514" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">頭を低くします</text>
</svg>
