<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>オーバーラップの有無と避ける側：横に並ぶ場合は風上の艇が、前後に離れている場合は後ろの艇が避ける</title>
<rect width="640" height="440" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6fd6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9aa3b2"/></marker></defs>
<rect x="10" y="8" width="620" height="206" rx="10" fill="#eaf2fb"/>
<rect x="10" y="226" width="620" height="206" rx="10" fill="#eaf2fb"/>
<line x1="36" y1="52" x2="36" y2="112" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="48" y="80" font-size="20" fill="#2f6fd6" text-anchor="start" font-weight="bold">風</text>
<line x1="36" y1="270" x2="36" y2="330" stroke="#2f6fd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="48" y="298" font-size="20" fill="#2f6fd6" text-anchor="start" font-weight="bold">風</text>
<text x="24" y="36" font-size="18" fill="#1f2a44" text-anchor="start" font-weight="bold">横に並んでいる（オーバーラップ）</text>
<g transform="translate(250,94) rotate(90) scale(1.5)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="10" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(300,156) rotate(90) scale(1.5)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="10" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<line x1="267" y1="62" x2="267" y2="196" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 5"/>
<text x="256" y="58" font-size="15" fill="#5b6475" text-anchor="end" font-weight="normal">風下の艇の最後尾</text>
<text x="190" y="98" font-size="16" fill="#1f2a44" text-anchor="end" font-weight="bold">風上艇</text>
<text x="228" y="176" font-size="16" fill="#1f2a44" text-anchor="end" font-weight="bold">風下艇</text>
<text x="420" y="96" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold">風上の艇が</text>
<text x="420" y="118" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold">風下の艇を避ける</text>
<text x="420" y="146" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">先端が線より前に出ている</text>
<text x="420" y="164" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">（後ろには下がっていない）</text>
<text x="24" y="254" font-size="18" fill="#1f2a44" text-anchor="start" font-weight="bold">前後に離れている（オーバーラップなし）</text>
<g transform="translate(170,330) rotate(90) scale(1.5)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="10" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(390,330) rotate(90) scale(1.5)"><path d="M0,-26 Q9,-6 7,22 L-7,22 Q-9,-6 0,-26 Z" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><line x1="0" y1="-4" x2="10" y2="22" stroke="#2f6fd6" stroke-width="4" stroke-linecap="round"/></g>
<line x1="357" y1="280" x2="357" y2="410" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 5"/>
<text x="350" y="276" font-size="15" fill="#5b6475" text-anchor="end" font-weight="normal">前の艇の最後尾</text>
<text x="170" y="380" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">後ろの艇</text>
<text x="170" y="400" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="normal">（クリア・アスターン）</text>
<text x="390" y="380" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">前の艇</text>
<text x="390" y="400" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="normal">（クリア・アヘッド）</text>
<text x="470" y="316" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold">後ろの艇が</text>
<text x="470" y="338" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold">前の艇を避ける</text>
<text x="470" y="366" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">先端が線より</text>
<text x="470" y="384" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal">後ろにある</text>
</svg>
